[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Runtime de Next.js da Netlify (OpenNext): serve as páginas, a rota /api/chat
# e os arquivos de /public. Declarado explicitamente porque o site foi criado
# como estático e a detecção automática do Next.js não acontece sozinha.
[[plugins]]
  package = "@netlify/plugin-nextjs"
